plugins { id 'com.android.application' }

def orientationName = providers.gradleProperty('langmakeOrientation').getOrElse('landscape')
def orientation = [landscape: [manifest: 'sensorLandscape', value: 6],
                   portrait: [manifest: 'sensorPortrait', value: 7],
                   sensor: [manifest: 'fullSensor', value: 10]][orientationName]
if (orientation == null) throw new GradleException('langmakeOrientation must be landscape, portrait or sensor')

android {
    namespace 'org.langmake.player'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId providers.gradleProperty('langmakeApplicationId').getOrElse('org.langmake.player')
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('langmakeBuildNumber').getOrElse('401').toInteger()
        versionName providers.gradleProperty('langmakeVersion').getOrElse('0.4.1')
        resValue 'string', 'app_name', providers.gradleProperty('langmakeLabel').getOrElse('Langmake')
        manifestPlaceholders = [langmakeOrientation: orientation.manifest]
        buildConfigField 'int', 'LANGMAKE_SCREEN_ORIENTATION', orientation.value.toString()
    }
    signingConfigs {
        debug {
            storeFile file(providers.gradleProperty('langmakeDebugKeystore').get())
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (providers.gradleProperty('langmakeReleaseKeystore').isPresent()) {
            release {
                storeFile file(providers.gradleProperty('langmakeReleaseKeystore').get())
                keyAlias providers.gradleProperty('langmakeKeyAlias').get()
                storePassword System.getenv(providers.gradleProperty('langmakeStorePasswordEnv').get())
                keyPassword System.getenv(providers.gradleProperty('langmakeKeyPasswordEnv').get())
            }
        }
    }
    buildTypes {
        debug { debuggable true; signingConfig signingConfigs.debug }
        release {
            debuggable false
            minifyEnabled false
            if (providers.gradleProperty('langmakeReleaseKeystore').isPresent()) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    lint { abortOnError true }
}
